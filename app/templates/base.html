<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Local CA{% endblock %} · Local CA Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">🔐 Local CA Manager</a>
  <nav>
    <a href="{{ url_for('index') }}">Áttekintés</a>
    <a href="{{ url_for('new', kind='server') }}">+ Szerver cert</a>
    <a href="{{ url_for('new', kind='client') }}">+ mTLS kliens</a>
    <a href="{{ url_for('sign') }}">CSR aláírás</a>
    <a href="{{ url_for('new', kind='intermediate') }}">+ Intermediate CA</a>
    <a href="{{ url_for('new', kind='root') }}">+ Root CA</a>
    <a href="{{ url_for('import_') }}">Import</a>
    <a href="{{ url_for('notifications') }}">Értesítések</a>
    <a href="{{ url_for('audit_page') }}">Audit</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script>
// A navigator.clipboard csak HTTPS-en / localhoston létezik; sima http-n a régi execCommand kell.
function copyFallback(t) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
async function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  }
  return copyFallback(t);
}
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async e => {
  e.preventDefault();
  const t = document.getElementById(b.dataset.copy).textContent;
  const ok = await copyText(t);
  if (!b.dataset.label) b.dataset.label = b.textContent;
  b.textContent = ok ? 'Másolva ✓' : 'Nem sikerült – jelöld ki kézzel';
  setTimeout(() => b.textContent = b.dataset.label, ok ? 1200 : 2500);
}));
document.querySelectorAll('form[data-confirm]').forEach(f => f.addEventListener('submit', e => {
  if (!confirm(f.dataset.confirm)) e.preventDefault();
}));
</script>
</body>
</html>
